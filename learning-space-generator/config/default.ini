[NEAT]
fitness_criterion     = max
fitness_threshold     = 0
pop_size              = 128
reset_on_extinction   = True
no_fitness_termination = False

[LearningSpaceGenome]
# Number of knowledge items. 'all' or empty = use all columns from data
knowledge_items = all
mutation_prob   = 1.0
mutation_sampling_dist = uniform

[DefaultSpeciesSet]
compatibility_threshold = 10.0

[DefaultStagnation]
species_fitness_func = mean
max_stagnation       = 10
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 1