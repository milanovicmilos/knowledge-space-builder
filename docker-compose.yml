version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
      - ./learning_space_generator:/app/learning_space_generator
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/learning_space_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - UPLOAD_PATH=/app/storage/uploads
      - LSG_PATH=/app/learning_space_generator
      - LSG_OUTPUT_PATH=/app/learning_space_generator/output
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile.worker
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
      - ./learning_space_generator:/app/learning_space_generator
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/learning_space_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - LSG_PATH=/app/learning_space_generator
      - LSG_OUTPUT_PATH=/app/learning_space_generator/output
    depends_on:
      - backend
      - redis
      - postgres
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=learning_space_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  storage_data:


